version: "2"
run:
  go: "1.27"
  timeout: 5m
  issues-exit-code: 1
  tests: true
# Gates are defined in docs/quality/STANDARD.md. Existing violations are listed in
# docs/quality/baseline.md and excluded below one by one (path + linter + text + reason).
linters:
  default: none
  enable:
    - bodyclose
    - containedctx
    - contextcheck
    - copyloopvar
    - dupl
    - durationcheck
    - errcheck
    - errname
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - funlen
    - gocognit
    - gocritic
    - gocyclo
    - godot
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nilerr
    - nilnil
    - nolintlint
    - noctx
    - predeclared
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    # sloglint, sqlclosecheck, rowserrcheck: skipped, the provider uses no log/slog and no database/sql.
  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 15
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    errcheck:
      check-type-assertions: true
      check-blank: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 60
      statements: 50
      ignore-comments: true
    dupl:
      threshold: 50
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
        - unnamedResult
    revive:
      rules:
        - name: var-naming
        - name: receiver-naming
        - name: errorf
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: indent-error-flow
        - name: unused-parameter
        - name: empty-block
        - name: context-as-argument
        - name: context-keys-type
        - name: exported
        - name: package-comments
        - name: unexported-return
        - name: early-return
        - name: defer
        - name: unhandled-error
          arguments:
            - "fmt.Fprint.*"
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    # Baseline: existing violations only (docs/quality/baseline.md). New code gets no entry here.
    rules:
      # baseline B1: CRUD handlers share one request/decode-error shape across the v1 resources.
      - path: internal/vapiv1/vapi_.*_resource\.go
        linters: [dupl]
        text: "lines are duplicate of `internal/vapiv1/vapi_.*_resource\\.go"
      # baseline B4: declarative Terraform schemas are long by construction.
      - path: internal/vapiv1/vapi_.*_resource\.go
        linters: [funlen]
        text: "Function 'Schema' is too long"
      # baseline B5: TestUploadData_TransportErrorText pins UploadData's transport error as unwrapped text.
      - path: internal/vapi/vapi-client\.go
        linters: [errorlint]
        text: "non-wrapping format verb"
      # baseline B2: test-harness value converter, complexity 16 (fix by splitting per tftypes kind).
      - path: internal/provider/tfvalue_test\.go
        linters: [gocognit]
        text: "cognitive complexity 16 of func `jsonToValue`"
      # baseline B3: test-harness fingerprint walker, complexity 18.
      - path: internal/provider/tfvalue_test\.go
        linters: [gocognit]
        text: "cognitive complexity 18 of func `tfFingerprintWalk`"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
        clothe-returns: true
        balance-calls: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
